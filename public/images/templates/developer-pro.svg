<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#0b0f15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#090c10"/>

  <!-- Top bar -->
  <rect x="40" y="24" width="720" height="40" fill="none" stroke="#1f2937" stroke-width="1"/>
  <text x="60" y="48" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Nexa</text>
  <text x="520" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Home</text>
  <text x="580" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">About</text>
  <text x="640" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Work</text>
  <text x="700" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#ffffff">Contact</text>

  <!-- Hero Mountain Landscape Container -->
  <g transform="translate(40, 80)">
    <rect width="720" height="280" rx="16" fill="url(#skyGrad)"/>
    
    <!-- Stars / Sky particles -->
    <circle cx="80" cy="40" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="180" cy="60" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="340" cy="30" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="540" cy="50" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="640" cy="25" r="1" fill="#ffffff" opacity="0.5"/>

    <!-- Mountain Peaks Silhouette -->
    <path d="M 0 280 L 120 160 L 220 220 L 380 90 L 520 230 L 620 150 L 720 280 Z" fill="url(#mountainGrad)"/>
    <!-- Snow caps -->
    <path d="M 380 90 L 350 135 L 370 145 L 385 125 L 405 145 L 415 130 Z" fill="#f8fafc" opacity="0.95"/>
    <path d="M 120 160 L 95 190 L 115 198 L 125 185 L 140 198 Z" fill="#f8fafc" opacity="0.9"/>
    <path d="M 620 150 L 595 185 L 615 192 L 625 180 L 645 192 Z" fill="#f8fafc" opacity="0.9"/>

    <!-- Hero Overlay Text -->
    <text x="50" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Designing</text>
    <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">digital experiences</text>
    <text x="50" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">I'm a full stack engineer building modern distributed web systems.</text>
    
    <rect x="50" y="200" width="115" height="34" rx="8" fill="#2563eb"/>
    <text x="75" y="222" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Get in Touch</text>
  </g>

  <!-- Featured Work Section -->
  <g transform="translate(40, 380)">
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Featured Work</text>

    <!-- Project Card 1: Mountain Explorer -->
    <rect x="0" y="35" width="225" height="150" rx="12" fill="url(#cardGrad)" stroke="#1f2937" stroke-width="1"/>
    <rect x="15" y="50" width="195" height="70" rx="8" fill="#1e293b"/>
    <path d="M 15 120 L 70 70 L 120 105 L 170 65 L 210 120 Z" fill="#3b82f6" opacity="0.5"/>
    <text x="15" y="142" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Mountain Explorer</text>
    <text x="15" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Web Platform</text>

    <!-- Project Card 2: Urban Grid -->
    <rect x="245" y="35" width="225" height="150" rx="12" fill="url(#cardGrad)" stroke="#1f2937" stroke-width="1"/>
    <rect x="260" y="50" width="195" height="70" rx="8" fill="#1e293b"/>
    <rect x="290" y="65" width="50" height="40" rx="4" fill="#64748b" transform="rotate(15 315 85)"/>
    <text x="260" y="142" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Urban Grid</text>
    <text x="260" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Architecture &amp; Cloud</text>

    <!-- Project Card 3: Solar App -->
    <rect x="490" y="35" width="230" height="150" rx="12" fill="url(#cardGrad)" stroke="#1f2937" stroke-width="1"/>
    <rect x="505" y="50" width="200" height="70" rx="8" fill="#1e293b"/>
    <circle cx="605" cy="85" r="22" fill="#3b82f6"/>
    <circle cx="605" cy="85" r="10" fill="#ffffff"/>
    <text x="505" y="142" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Solar App</text>
    <text x="505" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Mobile Engineering</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="thumbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <clipPath id="portraitClip">
      <rect x="480" y="80" width="260" height="250" rx="16" />
    </clipPath>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#warmBg)"/>

  <!-- Top bar -->
  <text x="60" y="48" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Alex</text>
  <text x="520" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">Home</text>
  <text x="580" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">About</text>
  <text x="640" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">Work</text>
  <text x="700" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Contact</text>
  <line x1="60" y1="62" x2="740" y2="62" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Hero Left -->
  <text x="60" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Hello,</text>
  <text x="60" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#0f172a" letter-spacing="-0.5">I'm Alex</text>
  <text x="60" y="215" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">A minimalist design director based in San Francisco,</text>
  <text x="60" y="235" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">crafting thoughtful brand narratives for the web.</text>

  <rect x="60" y="260" width="105" height="34" rx="8" fill="#0f172a"/>
  <text x="85" y="282" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">View Work</text>

  <!-- Hero Right: Portrait of woman in cream outfit -->
  <g clip-path="url(#portraitClip)">
    <rect x="480" y="80" width="260" height="250" fill="#f5ede6"/>
    <ellipse cx="610" cy="180" rx="46" ry="56" fill="#e8c4a9"/>
    <!-- Hair -->
    <path d="M 545 190 Q 565 110 610 110 Q 660 110 675 190 Q 670 250 660 280 L 560 280 Z" fill="#3d2817"/>
    <!-- Front Hair parting -->
    <path d="M 570 145 Q 610 125 650 150 Q 640 135 610 135 Q 580 135 570 145 Z" fill="#2d1c0f"/>
    <!-- Eyes, Nose, Lips -->
    <ellipse cx="595" cy="175" rx="3.5" ry="2.5" fill="#2d1c0f"/>
    <ellipse cx="625" cy="175" rx="3.5" ry="2.5" fill="#2d1c0f"/>
    <path d="M 610 178 L 608 192 L 613 194" stroke="#cfa385" stroke-width="2" fill="none"/>
    <path d="M 602 208 Q 610 213 618 208" stroke="#b56358" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Cream Sweater -->
    <path d="M 530 240 Q 610 255 690 240 L 710 330 L 510 330 Z" fill="#faf5ef"/>
    <path d="M 585 240 Q 610 260 635 240 Z" fill="#e8c4a9"/>
  </g>
  <rect x="480" y="80" width="260" height="250" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Selected Work Section -->
  <text x="60" y="380" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Selected Work</text>

  <!-- 4 Photo Grid Tiles -->
  <g transform="translate(60, 400)">
    <!-- Tile 1 -->
    <rect x="0" y="0" width="155" height="150" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 0 150 L 40 85 L 85 125 L 125 75 L 155 150 Z" fill="#94a3b8" opacity="0.6"/>
    <text x="12" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Lookbook</text>

    <!-- Tile 2 -->
    <rect x="175" y="0" width="155" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="252" cy="65" r="28" fill="#e2e8f0"/>
    <rect x="220" y="105" width="65" height="8" rx="2" fill="#cbd5e1"/>
    <text x="187" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Editorial</text>

    <!-- Tile 3 -->
    <rect x="350" y="0" width="155" height="150" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="375" y="30" width="105" height="70" rx="6" fill="#cbd5e1"/>
    <text x="362" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Identity</text>

    <!-- Tile 4 -->
    <rect x="525" y="0" width="155" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="550" y="25" width="50" height="75" rx="4" fill="#94a3b8" opacity="0.5"/>
    <rect x="610" y="45" width="45" height="55" rx="4" fill="#cbd5e1"/>
    <text x="537" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Packaging</text>
  </g>
</svg>

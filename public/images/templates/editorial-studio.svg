<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#141416"/>

  <!-- Minimal Header -->
  <rect x="60" y="36" width="680" height="36" fill="none" stroke="#2e2e34" stroke-width="1"/>
  <text x="80" y="59" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="2">EDITORIAL STUDIO</text>
  <rect x="620" y="47" width="100" height="14" rx="2" fill="#2a2a30"/>

  <!-- Dramatic Center Magazine Hero -->
  <text x="400" y="150" font-family="Georgia, serif" font-size="38" font-weight="700" text-anchor="middle" fill="#ffffff" letter-spacing="1">ARCHITECTURAL DESIGN</text>
  <text x="400" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="300" text-anchor="middle" fill="#9ca3af">Curated projects, publications, and critical essays</text>

  <!-- Editorial Showcase Frame -->
  <rect x="60" y="220" width="680" height="180" rx="4" fill="#1c1c20" stroke="#2e2e34"/>
  <rect x="80" y="240" width="300" height="140" fill="#0d0d0f"/>
  <text x="410" y="270" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff">The Monolith Library</text>
  <text x="410" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">Cultural Infrastructure &amp; Public Space</text>
  <rect x="410" y="315" width="300" height="6" rx="2" fill="#4b5563"/>
  <rect x="410" y="328" width="260" height="6" rx="2" fill="#374151"/>

  <!-- Secondary Columns -->
  <rect x="60" y="420" width="325" height="140" rx="4" fill="#1c1c20" stroke="#2e2e34"/>
  <rect x="80" y="440" width="120" height="100" fill="#0d0d0f"/>
  <text x="215" y="465" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">Nordic Pavilions</text>
  <rect x="215" y="485" width="150" height="6" rx="2" fill="#4b5563"/>

  <rect x="415" y="420" width="325" height="140" rx="4" fill="#1c1c20" stroke="#2e2e34"/>
  <rect x="435" y="440" width="120" height="100" fill="#0d0d0f"/>
  <text x="570" y="465" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">Geometric Volumes</text>
  <rect x="570" y="485" width="150" height="6" rx="2" fill="#4b5563"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <clipPath id="creativeClip">
      <rect x="480" y="80" width="260" height="250" rx="16" />
    </clipPath>
    <linearGradient id="warmLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f8f4ec"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#warmLightBg)"/>

  <!-- Top bar -->
  <text x="60" y="48" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#18181b">Flow</text>
  <text x="520" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#71717a">Home</text>
  <text x="580" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#71717a">About</text>
  <text x="640" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#71717a">Work</text>
  <text x="700" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#18181b">Contact</text>
  <line x1="60" y1="62" x2="740" y2="62" stroke="#e4e4e7" stroke-width="1"/>

  <!-- Hero Left -->
  <text x="60" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#18181b" letter-spacing="-0.5">Designing</text>
  <text x="60" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#18181b" letter-spacing="-0.5">Better Experiences</text>
  <text x="60" y="215" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#71717a">A modern, artistic template for creatives, designers</text>
  <text x="60" y="235" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#71717a">and storytellers presenting work with visual rhythm.</text>

  <rect x="60" y="260" width="105" height="34" rx="8" fill="#18181b"/>
  <text x="85" y="282" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">View Work</text>

  <!-- Hero Right: Portrait of woman artist looking right -->
  <g clip-path="url(#creativeClip)">
    <rect x="480" y="80" width="260" height="250" fill="#faebd7"/>
    <ellipse cx="600" cy="180" rx="42" ry="52" fill="#eec8b0"/>
    <!-- Hair bun / ponytail -->
    <path d="M 540 190 Q 560 110 610 110 Q 655 110 660 180 Q 640 220 620 250 L 550 250 Z" fill="#18181b"/>
    <ellipse cx="655" cy="155" rx="18" ry="24" fill="#18181b"/>
    <!-- Face looking right -->
    <ellipse cx="615" cy="175" rx="3" ry="2.5" fill="#18181b"/>
    <path d="M 622 178 L 632 190 L 624 193" stroke="#d49b79" stroke-width="2" fill="none"/>
    <path d="M 620 206 Q 628 210 634 206" stroke="#b9584d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Warm mustard / terracotta top -->
    <path d="M 530 240 Q 600 255 670 240 L 690 330 L 510 330 Z" fill="#e0a96d"/>
  </g>
  <rect x="480" y="80" width="260" height="250" rx="16" fill="none" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Featured Work Section -->
  <text x="60" y="380" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#18181b">Featured Work</text>

  <!-- 4 Design Showcase Cards -->
  <g transform="translate(60, 400)">
    <!-- Tile 1 -->
    <rect x="0" y="0" width="155" height="150" rx="10" fill="#f4ede4" stroke="#e4dacf" stroke-width="1"/>
    <circle cx="77" cy="65" r="28" fill="#d97706" opacity="0.4"/>
    <text x="12" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#18181b">Fluid Forms</text>

    <!-- Tile 2 -->
    <rect x="175" y="0" width="155" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="200" y="35" width="105" height="50" rx="6" fill="#3b82f6" opacity="0.4"/>
    <text x="187" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#18181b">Digital Art</text>

    <!-- Tile 3 -->
    <rect x="350" y="0" width="155" height="150" rx="10" fill="#fef2f2" stroke="#fee2e2" stroke-width="1"/>
    <ellipse cx="427" cy="65" rx="35" ry="25" fill="#ef4444" opacity="0.3"/>
    <text x="362" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#18181b">Sculptures</text>

    <!-- Tile 4 -->
    <rect x="525" y="0" width="155" height="150" rx="10" fill="#f0fdf4" stroke="#dcfce7" stroke-width="1"/>
    <rect x="550" y="30" width="105" height="55" rx="6" fill="#10b981" opacity="0.3"/>
    <text x="537" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#18181b">Exhibits</text>
  </g>
</svg>

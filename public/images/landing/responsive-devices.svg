<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="100%" height="100%">
  <defs>
    <filter id="devShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </linearGradient>
    <clipPath id="laptopClip">
      <rect x="50" y="40" width="380" height="250" rx="8" />
    </clipPath>
    <clipPath id="phoneClip">
      <rect x="420" y="100" width="150" height="260" rx="24" />
    </clipPath>
  </defs>

  <!-- Laptop Body -->
  <g filter="url(#devShadow)">
    <!-- Laptop screen outer frame -->
    <rect x="40" y="30" width="400" height="270" rx="14" fill="#1e222d" stroke="#333846" stroke-width="2"/>
    <circle cx="240" cy="36" r="2.5" fill="#475569"/>

    <!-- Laptop Screen Display -->
    <g clip-path="url(#laptopClip)">
      <rect x="50" y="40" width="380" height="250" fill="url(#screenGrad)"/>
      <!-- Top header line -->
      <line x1="50" y1="65" x2="430" y2="65" stroke="#262b38" stroke-width="1"/>
      <circle cx="70" cy="53" r="3" fill="#3b82f6"/>
      <text x="80" y="57" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f8fafc">Portfolify</text>

      <!-- Content -->
      <text x="70" y="105" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Your story.</text>
      <text x="70" y="125" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#60a5fa">Your portfolio.</text>
      <text x="70" y="145" font-family="system-ui, sans-serif" font-size="8" font-weight="400" fill="#94a3b8">A showcase designed for your career impact.</text>

      <rect x="70" y="160" width="75" height="22" rx="5" fill="#2563eb"/>
      <text x="86" y="174" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff">Get Started</text>

      <!-- Avatar photo in laptop -->
      <rect x="250" y="80" width="140" height="150" rx="10" fill="#1e2330"/>
      <ellipse cx="320" cy="130" rx="28" ry="32" fill="#ffd7ba"/>
      <path d="M 285 180 Q 320 185 355 180 L 360 230 L 280 230 Z" fill="#0f172a"/>
      <path d="M 292 115 Q 320 90 348 115 Z" fill="#0f172a"/>
    </g>

    <!-- Laptop Base -->
    <path d="M 10 300 L 470 300 L 450 312 L 30 312 Z" fill="#2d3342"/>
    <rect x="190" y="300" width="100" height="4" rx="2" fill="#1e222d"/>
  </g>

  <!-- Smartphone Mockup in Front -->
  <g filter="url(#devShadow)">
    <!-- Phone frame -->
    <rect x="415" y="95" width="160" height="270" rx="28" fill="#1e222d" stroke="#333846" stroke-width="2.5"/>
    <!-- Phone screen -->
    <g clip-path="url(#phoneClip)">
      <rect x="420" y="100" width="150" height="260" fill="#0d1117"/>
      <!-- Notch / Island -->
      <rect x="465" y="106" width="60" height="12" rx="6" fill="#1e222d"/>
      <circle cx="515" cy="112" r="2.5" fill="#3b82f6"/>

      <!-- Mobile Content -->
      <circle cx="495" cy="155" r="22" fill="#ffd7ba"/>
      <path d="M 473 145 Q 495 125 517 145 Z" fill="#0f172a"/>
      <text x="495" y="195" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Alex Carter</text>
      <text x="495" y="210" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#60a5fa" text-anchor="middle">Product Designer</text>

      <!-- Mini Project Cards -->
      <rect x="435" y="230" width="120" height="45" rx="6" fill="#161b24" stroke="#262c38"/>
      <rect x="445" y="240" width="40" height="6" rx="2" fill="#94a3b8"/>
      <rect x="445" y="252" width="60" height="5" rx="2" fill="#64748b"/>
      <circle cx="540" cy="252" r="6" fill="#2563eb"/>

      <rect x="435" y="285" width="120" height="45" rx="6" fill="#161b24" stroke="#262c38"/>
      <rect x="445" y="295" width="50" height="6" rx="2" fill="#94a3b8"/>
    </g>
  </g>

  <!-- Fully Responsive Floating Badge -->
  <g transform="translate(430, 60)" filter="url(#devShadow)">
    <rect width="135" height="30" rx="15" fill="#141822" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4.5" fill="#3b82f6"/>
    <text x="28" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Fully responsive</text>
  </g>
</svg>
